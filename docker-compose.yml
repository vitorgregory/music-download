services:
  music-download:
    image: ghcr.io/vitorgregory/music-download:latest
    platform: linux/amd64
    container_name: music-download
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /DATA/AppData/music-download/data:/app/data
      - /DATA/AppData/music-download/downloads:/app/downloads
      - /DATA/AppData/music-download/config:/app/config
      - /DATA/AppData/music-download/wrapper-lite:/app/wrapper-lite-data
    environment:
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"
      DISABLE_QUEUE_WORKER: "0"
      WRAPPER_BIN: "/app/wrapper"
      WRAPPER_ROOTFS: "/app/rootfs"
      WRAPPER_CACHE_DIR: "/app/config/wrapper"
      WRAPPER_LITE_2FA_FILE: "/app/wrapper-lite-data/2fa.txt"
      RATELIMIT_STORAGE_URL: "redis://redis:6379/0"
      STALL_TIMEOUT_SECONDS: "300"
      MAX_RETRIES: "3"
      RETRY_BASE_SECONDS: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    depends_on:
      wrapper-lite:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: music-download-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /DATA/AppData/music-download/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wrapper-lite:
    build:
      context: https://github.com/WorldObservationLog/wrapper.git#lite
      dockerfile: Dockerfile
    image: music-download-wrapper-lite:latest
    container_name: music-download-wrapper-lite
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    env_file:
      - .env
    volumes:
      - /DATA/AppData/music-download/wrapper-lite:/app/rootfs/data
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
