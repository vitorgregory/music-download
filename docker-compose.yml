# Music Download — instalável pelo painel do ZimaOS / CasaOS
# No painel ZimaOS: Apps → Custom Compose → importar este arquivo.
# No terminal: docker compose --project-name music-download up -d

name: music-download

x-casaos:
  id: com.vitorgregory.music-download
  main: music-download
  index: /
  port_map: "5000"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/apple-music.png
  title:
    en_US: Music Download
    pt_BR: Music Download
  tagline:
    en_US: Apple Music download manager
    pt_BR: Gerenciador de downloads do Apple Music
  description:
    en_US: Manage Apple Music downloads (ALAC, AAC, Dolby Atmos) from a web interface.
    pt_BR: Gerencie downloads do Apple Music (ALAC, AAC, Atmos) por uma interface web.
  author: Vitor Gregory
  developer: Vitor Gregory
  category: Media
  architectures:
    - amd64
  version: "1.0.1"
  update_at: "2026-11-25"
  release_notes:
    en_US: Added track-count display, cancel button, skip-link accessibility, focus-visible rings.
    pt_BR: Exibição de faixas, botão cancelar, acessibilidade skip-link e focus-visible.

services:
  music-download:
    image: ghcr.io/vitorgregory/music-download:latest
    platform: linux/amd64
    container_name: music-download
    restart: unless-stopped
    ports:
      - "${MUSIC_PORT:-5000}:5000"
    volumes:
      # ZimaOS padrão: ajuste se sua pasta de deploy for diferente
      - "/DATA/AppData/music-download/data:/app/data"
      - "/DATA/AppData/music-download/downloads:/app/downloads"
      - "/DATA/AppData/music-download/config:/app/config"
      - "/DATA/AppData/music-download/wrapper-lite-data:/app/wrapper-lite-data"
    environment:
      TZ: "${TZ:-America/Sao_Paulo}"
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"
      DISABLE_QUEUE_WORKER: "0"
      WRAPPER_BIN: "/app/wrapper"
      WRAPPER_ROOTFS: "/app/rootfs"
      WRAPPER_CACHE_DIR: "/app/config/wrapper"
      WRAPPER_LITE_2FA_FILE: "/app/wrapper-lite-data/2fa.txt"
      STALL_TIMEOUT_SECONDS: "${STALL_TIMEOUT:-300}"
      MAX_RETRIES: "${MAX_RETRIES:-3}"
      RETRY_BASE_SECONDS: "${RETRY_BASE:-5}"
    depends_on:
      wrapper-lite:
        condition: service_started

  wrapper-lite:
    build:
      context: https://github.com/WorldObservationLog/wrapper.git#lite
      dockerfile: Dockerfile
    image: music-download-wrapper-lite:latest
    pull_policy: build
    container_name: music-download-wrapper-lite
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    volumes:
      - "/DATA/AppData/music-download/wrapper-data:/app/rootfs/data"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
